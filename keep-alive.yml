name: Keep the schedule alive

# GitHub turns off scheduled workflows in a repo that has had no
# activity for 60 days. This makes a tiny change once a month so
# your seat checker never gets switched off without you noticing.

on:
  schedule:
    - cron: "17 13 1 * *"   # 1st of the month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch the heartbeat file
        run: |
          date -u +"Last keep-alive: %Y-%m-%d %H:%M UTC" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff --staged --quiet || git commit -m "Keep schedule alive [skip ci]"
          git push
