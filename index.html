<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCC Seat Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout idea: a status board. Summary tiles on top, one row per class. */
  :root {
    --bg:        #eef1f4;
    --surface:   #ffffff;
    --edge:      #d6dce3;
    --ink:       #10171f;
    --muted:     #5d6b7a;
    --accent:    #1f4f91;
    --open:      #0b6b40;
    --open-bg:   #dff2e6;
    --full:      #64717f;
    --full-bg:   #e6eaee;
    --warn:      #8f3519;
    --warn-bg:   #fae7e1;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#10151b; --surface:#19202a; --edge:#2b3542; --ink:#e7edf4;
      --muted:#97a5b5; --accent:#7aa6e8; --open:#5fd39a; --open-bg:#15352a;
      --full:#8c99a8; --full-bg:#222b36; --warn:#f0a38c; --warn-bg:#3a201a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#10151b; --surface:#19202a; --edge:#2b3542; --ink:#e7edf4;
    --muted:#97a5b5; --accent:#7aa6e8; --open:#5fd39a; --open-bg:#15352a;
    --full:#8c99a8; --full-bg:#222b36; --warn:#f0a38c; --warn-bg:#3a201a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:16px; line-height:1.5;
    padding:24px 16px 56px;
  }
  .wrap { max-width: 760px; margin:0 auto; }

  header { display:flex; flex-wrap:wrap; gap:12px 20px;
           align-items:baseline; justify-content:space-between; margin-bottom:22px; }
  h1 { font-family:var(--display); font-weight:700; font-size:27px;
       letter-spacing:-.015em; margin:0; text-wrap:balance; }
  .checked { font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .checked b { color:var(--ink); font-weight:600; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
           gap:12px; margin-bottom:20px; }
  .tile { background:var(--surface); border:1px solid var(--edge);
          border-radius:12px; padding:14px 16px; }
  .tile .n { font-family:var(--display); font-size:34px; font-weight:700;
             line-height:1.05; font-variant-numeric:tabular-nums; }
  .tile .n.good { color:var(--open); }
  .tile .k { font-size:13px; color:var(--muted); margin-top:3px; }

  .rows { display:flex; flex-direction:column; gap:10px; }
  .row { background:var(--surface); border:1px solid var(--edge);
         border-radius:12px; padding:14px 16px; display:flex;
         flex-wrap:wrap; gap:10px 16px; align-items:center;
         border-left:4px solid var(--full); }
  .row.is-open { border-left-color:var(--open); }
  .row.is-missing { border-left-color:var(--warn); }
  .row .id { font-family:var(--mono); font-weight:600; font-size:15px;
             letter-spacing:-.02em; }
  .row .term { font-size:13px; color:var(--muted); }
  .row .spacer { flex:1 1 auto; }
  .seats { font-family:var(--mono); font-size:19px; font-weight:600;
           font-variant-numeric:tabular-nums; }
  .seats .cap { color:var(--muted); font-weight:500; font-size:15px; }
  .pill { font-size:13px; font-weight:600; padding:3px 11px; border-radius:999px;
          background:var(--full-bg); color:var(--full); white-space:nowrap; }
  .pill.open { background:var(--open-bg); color:var(--open); }
  .pill.missing { background:var(--warn-bg); color:var(--warn); }
  .row a.go { font-size:14px; color:var(--accent); font-weight:600;
              text-decoration:none; white-space:nowrap; }
  .row a.go:hover { text-decoration:underline; }

  .bar { display:flex; flex-wrap:wrap; gap:10px; margin:22px 0 10px; }
  button, .btn {
    font:inherit; font-size:14px; font-weight:600; cursor:pointer;
    border:1px solid var(--edge); background:var(--surface); color:var(--ink);
    padding:10px 16px; border-radius:9px; text-decoration:none; display:inline-block;
  }
  button:hover, .btn:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { color:#fff; filter:brightness(1.1); }
  button:disabled { opacity:.55; cursor:default; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline:2px solid var(--accent); outline-offset:2px; }

  .note { font-size:13.5px; color:var(--muted); margin-top:14px; }
  .note code { font-family:var(--mono); font-size:12.5px; }
  .msg { margin-top:14px; padding:11px 14px; border-radius:9px; font-size:14px;
         background:var(--full-bg); color:var(--ink); }
  .msg.bad { background:var(--warn-bg); color:var(--warn); }
  .msg.good { background:var(--open-bg); color:var(--open); }

  details { margin-top:22px; border-top:1px solid var(--edge); padding-top:16px; }
  summary { cursor:pointer; font-size:14px; color:var(--muted); font-weight:600; }
  details .inner { margin-top:12px; display:flex; flex-direction:column; gap:10px;
                   max-width:430px; }
  input[type=password], input[type=text] {
    font:inherit; font-family:var(--mono); font-size:13px; padding:9px 11px;
    border:1px solid var(--edge); border-radius:8px;
    background:var(--bg); color:var(--ink); width:100%;
  }
  .skel { color:var(--muted); font-size:14px; }
  @media (prefers-reduced-motion: no-preference) {
    .row, .tile { transition: border-color .15s ease; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>TCC Seat Watch</h1>
    <div class="checked" id="checked">Loading…</div>
  </header>

  <div class="tiles">
    <div class="tile"><div class="n good" id="tOpen">–</div>
      <div class="k">classes with a seat</div></div>
    <div class="tile"><div class="n" id="tTotal">–</div>
      <div class="k">classes watched</div></div>
    <div class="tile"><div class="n" id="tSeats">–</div>
      <div class="k">open seats in total</div></div>
  </div>

  <div class="rows" id="rows">
    <div class="skel">Reading your watch list…</div>
  </div>

  <div class="bar">
    <button class="primary" id="btnRefresh">Refresh now</button>
  </div>

  <div id="msg"></div>

  <p class="note">
    Seats come from your watcher's last check on your server, not live from
    TCC. This page updates itself every minute.
  </p>

</div>

<script>
const TCC = "https://selfservice.tccd.edu/Student/Courses/Search?keyword=";

const $ = function (id) { return document.getElementById(id); };

function esc(t) {
  return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function showMsg(text, kind) {
  $("msg").innerHTML = text ? '<div class="msg ' + (kind || "") + '">' + text + "</div>" : "";
}
function ago(iso) {
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins === 1) return "1 minute ago";
  if (mins < 60) return mins + " minutes ago";
  const h = Math.round(mins / 60);
  return h === 1 ? "1 hour ago" : h + " hours ago";
}

function render(list, sections) {
  const rows = $("rows");
  rows.innerHTML = "";
  let openCount = 0, seatTotal = 0;

  list.forEach(function (name) {
    const s = sections[name] || {};
    const waiting = s.found === null || s.found === undefined;
    const found = s.found === true;
    const open = found && typeof s.open === "number" ? s.open : null;
    const isOpen = open !== null && open >= 1;
    if (isOpen) { openCount += 1; seatTotal += open; }

    const row = document.createElement("div");
    row.className = "row" + (isOpen ? " is-open" : (found || waiting) ? "" : " is-missing");
    row.innerHTML =
      '<div><div class="id">' + esc(name) + "</div>" +
      '<div class="term">' + esc(s.term || (waiting ? "Waiting for first check" : "Not on TCC right now")) + "</div></div>" +
      '<div class="spacer"></div>' +
      (found
        ? '<div class="seats">' + esc(open) + ' <span class="cap">of ' + esc(s.capacity) + "</span></div>"
        : '<div class="seats cap">–</div>') +
      '<span class="pill ' + (isOpen ? "open" : (found || waiting) ? "" : "missing") + '">' +
        (isOpen ? "Seat open" : found ? "Full" : waiting ? "Waiting" : "Not found") + "</span>" +
      '<a class="go" href="' + TCC + encodeURIComponent(name) +
        '" target="_blank" rel="noopener">Open on TCC</a>';
    rows.appendChild(row);
  });

  $("tOpen").textContent = openCount;
  $("tTotal").textContent = list.length;
  $("tSeats").textContent = seatTotal;
}

async function load() {
  try {
    const r = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    render(d.watchlist || [], d.sections || {});

    let text;
    if (d.checked_at) {
      text = "Last checked <b>" + ago(d.checked_at) + "</b>";
      if (d.ok === false) text += ' · <span style="color:var(--warn)">last check had a problem</span>';
    } else {
      text = "No check yet";
    }
    if (d.quiet_now) text += " · quiet hours (" + esc(d.quiet_hours) + ")";
    if (d.interval) text += " · every " + esc(d.interval) + " seconds";
    $("checked").innerHTML = text;
  } catch (e) {
    $("rows").innerHTML = '<div class="msg bad">Could not reach your watcher. ' +
      "Open this page from your server address, for example " +
      "http://YOUR-SERVER-IP:8080 (" + esc(e.message) + ")</div>";
    $("checked").textContent = "No data";
  }
}

$("btnRefresh").addEventListener("click", function () { showMsg(""); load(); });

load();
setInterval(load, 60000);
</script>
</body>
</html>
