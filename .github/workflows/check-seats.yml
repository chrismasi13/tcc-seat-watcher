name: Check TCC seats

on:
  schedule:
    # Every 5 minutes, except 08:00-10:59 UTC.
    # That is the quiet overnight window: 2am-5am Central in winter,
    # 3am-6am Central in summer. GitHub cron is UTC only and does not
    # follow daylight saving, so the window shifts by an hour.
    - cron: "*/5 0-7,11-23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run with no alert sent"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tcc-seat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install what it needs
        run: pip install -r requirements.txt

      - name: Check the seats
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_PRIORITY: ${{ secrets.NTFY_PRIORITY }}
          ALERT_REPEATS: ${{ secrets.ALERT_REPEATS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python check_once.py

      - name: Remember what was already alerted
        if: always()
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "Nothing changed. No commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update seat alert state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "Push attempt $i failed, trying again..."
            sleep 5
          done
          echo "Could not save state. The next run will recheck from scratch."
          exit 0
